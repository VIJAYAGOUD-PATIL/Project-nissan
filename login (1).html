<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef2ff;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff;
      width: 100%; max-width: 400px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(79,70,229,0.10);
      padding: 2.5rem 2rem 2rem;
    }
    .logo {
      width: 48px; height: 48px;
      background: #4f46e5; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .logo svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h2 { text-align: center; font-size: 20px; font-weight: 600; color: #1a1a2e; margin-bottom: 0.25rem; }
    .subtitle { text-align: center; font-size: 13px; color: #888; margin-bottom: 1.75rem; }
    label { display: block; font-size: 12.5px; font-weight: 500; color: #444; margin-bottom: 5px; }
    .input-wrap { position: relative; margin-bottom: 1rem; }
    .input-wrap .icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; pointer-events: none;
      fill: none; stroke: #aaa; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 36px 10px 36px;
      border: 1.5px solid #e0e0e0; border-radius: 9px;
      font-size: 14px; color: #1a1a2e; outline: none;
      transition: border 0.2s, box-shadow 0.2s; background: #fafafa;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.10); background: #fff; }
    .toggle-pass {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .toggle-pass svg { width: 16px; height: 16px; fill: none; stroke: #aaa; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .btn {
      width: 100%; padding: 11px;
      background: #4f46e5; color: #fff;
      font-size: 15px; font-weight: 600;
      border: none; border-radius: 9px;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: #4338ca; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    .msg { margin-top: 1rem; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
    .msg.error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
    .msg.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: block; }
    .spinner {
      display: inline-block; width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">

  <div class="logo">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>

  <h2>Welcome back</h2>
  <p class="subtitle">Enter your credentials to continue</p>

  <label for="username">Username</label>
  <div class="input-wrap">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
  </div>

  <label for="password">Password</label>
  <div class="input-wrap">
    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
    <button class="toggle-pass" type="button" onclick="togglePassword()" title="Show/hide password">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">Login</button>
  <div class="msg" id="msg"></div>
</div>

<script>
  // ─── CONFIGURE HERE ──────────────────────────────────────────────────────────
  const TARGET_URL        = "https://YOUR-TARGET-URL.com/login"; // ← Your URL
  const USERNAME_SELECTOR = "input[name='username']";            // ← Username field on target page
  const PASSWORD_SELECTOR = "input[name='password']";            // ← Password field on target page
  const SUBMIT_SELECTOR   = "button[type='submit']";             // ← Submit button on target page
  // ─────────────────────────────────────────────────────────────────────────────

  function togglePassword() {
    const inp = document.getElementById("password");
    inp.type = inp.type === "password" ? "text" : "password";
  }

  function showMsg(text, type) {
    const el = document.getElementById("msg");
    el.textContent = text;
    el.className = "msg " + type;
  }

  async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");

    if (!username || !password) {
      showMsg("Please enter both username and password.", "error");
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Opening browser...';
    showMsg("", "");

    try {
      const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username,
          password,
          targetUrl: TARGET_URL,
          usernameSelector: USERNAME_SELECTOR,
          passwordSelector: PASSWORD_SELECTOR,
          submitSelector: SUBMIT_SELECTOR
        })
      });
      const data = await res.json();
      if (data.success) {
        showMsg("✓ Login successful! Browser opened.", "success");
      } else {
        showMsg("Login failed: " + (data.error || "Unknown error"), "error");
      }
    } catch (e) {
      showMsg("Cannot connect to server.js. Make sure it is running: node server.js", "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = "Login";
    }
  }
</script>
</body>
</html>
